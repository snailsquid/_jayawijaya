title: Multiple Choice Questions
description: Questions with multiple correct answers - select all that apply
questions:
  - question: Which of the following are prime numbers? (Select all that apply)
    answers:
    - 2
    - 4
    - 7
    - 9
    correct_answer: [1, 3]
    explanation: 2 and 7 are prime numbers. 4 and 9 are composite.
    point: 2

  - question: Which fruits are citrus? (Select all that apply)
    answers:
    - Apple
    - Orange
    - Banana
    - Lemon
    correct_answer: [2, 4]
    explanation: Oranges and lemons are citrus fruits

  - question: Which are programming languages? (Select all that apply)
    answers:
    - Python
    - HTML
    - JavaScript
    - CSS
    correct_answer: [1, 3]
    explanation: Python and JavaScript are programming languages. HTML and CSS are markup/stylesheet languages.
    point: 3

  - question: Which are even numbers? (Select all that apply)
    answers:
    - 1
    - 2
    - 3
    - 4
    correct_answer: [2, 4]
    point: 1

  - question: Which are vowels? (Select all that apply)
    answers:
    - A
    - B
    - E
    - O
    correct_answer: [1, 3, 4]
    explanation: A, E, O are vowels