name: Deploy to Hetzner

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "/home/runner/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload to Hetzner
        uses: appleboy/scp-action@v0.1.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          target: /tmp/jayawijaya
          source: dist/*

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          capture_stdout: true
          script: |
            find /tmp -name "jayawijaya" -type d 2>/dev/null
            ls -la /tmp/jayawijaya/ 2>/dev/null || echo "jayawijaya not found"
            rm -rf /var/www/html/*
            cp -r /tmp/jayawijaya/. /var/www/html/ 2>&1
            ls -la /var/www/html/