name: Deploy to Hetzner

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "/home/runner/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload dist to Hetzner
        uses: appleboy/scp-action@v0.1.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          target: /tmp/jayawijaya_dist
          source: dist

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Listing /tmp/jayawijaya_dist structure ==="
            ls -laR /tmp/jayawijaya_dist/ || true
            
            echo "=== Finding nginx document root ==="
            NGINX_ROOT=$(grep -rE "root\s+" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ /etc/nginx/nginx.conf 2>/dev/null | grep -v "^#" | grep -v "root\s*;" | head -1 | awk '{print $2}' | sed 's/;//g')
            if [ -z "$NGINX_ROOT" ]; then
              NGINX_ROOT="/var/www/html"
            fi
            echo "Nginx document root: $NGINX_ROOT"
            
            echo "=== Clearing document root ==="
            rm -rf "${NGINX_ROOT:?}"/*
            
            echo "=== Copying files ==="
            if [ -d "/tmp/jayawijaya_dist/dist" ]; then
              echo "Found dist subdirectory, copying from dist/"
              cp -r /tmp/jayawijaya_dist/dist/* "$NGINX_ROOT/"
            else
              echo "No dist subdirectory, copying from root"
              cp -r /tmp/jayawijaya_dist/* "$NGINX_ROOT/"
            fi
            
            echo "=== Cleaning up ==="
            rm -rf /tmp/jayawijaya_dist
            
            echo "=== Verifying deployment ==="
            ls -laR "$NGINX_ROOT/"
            echo "=== Checking index.html content ==="
            head -n 10 "$NGINX_ROOT/index.html"
            
            echo "=== Testing localhost ==="
            curl -s http://localhost/ | grep -o 'src="[^"]*"' || echo "localhost check failed"
            
            echo "=== Reloading nginx ==="
            systemctl reload nginx
            echo "=== Deployment complete ==="

      - name: Purge Cloudflare Cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || true
          else
            echo "No Cloudflare credentials found, skipping cache purge"
          fi
