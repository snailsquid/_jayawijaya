name: Deploy to Hetzner

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "/home/runner/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload dist to Hetzner
        uses: appleboy/scp-action@v0.1.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          target: /tmp/jayawijaya_dist
          source: dist

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Listing /tmp/jayawijaya_dist ==="
            ls -laR /tmp/jayawijaya_dist/ || true
            
            echo "=== Deploying to jayawijaya container ==="
            if [ -d "/tmp/jayawijaya_dist/dist" ]; then
              docker cp /tmp/jayawijaya_dist/dist/. jayawijaya:/usr/share/nginx/html/
            else
              docker cp /tmp/jayawijaya_dist/. jayawijaya:/usr/share/nginx/html/
            fi
            docker exec jayawijaya nginx -s reload 2>/dev/null || docker restart jayawijaya
            
            echo "=== Verifying container deployment ==="
            docker exec jayawijaya ls -la /usr/share/nginx/html/ || echo "Container check failed"
            docker exec jayawijaya head -n 10 /usr/share/nginx/html/index.html || echo "Container index check failed"
            
            echo "=== Cleaning up ==="
            rm -rf /tmp/jayawijaya_dist
            
            echo "=== Deployment complete ==="

      - name: Purge Cloudflare Cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_ZONE_ID" ] && [ -n "$CF_API_TOKEN" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || true
          else
            echo "No Cloudflare credentials found, skipping cache purge"
          fi
